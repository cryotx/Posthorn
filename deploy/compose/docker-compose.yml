name: posthorn-example

services:
  posthorn:
    image: posthorn:local
    pull_policy: never
    build:
      context: ../../core
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTHORN_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./posthorn.toml
        target: /etc/posthorn/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /var/lib/posthorn
        bind:
          create_host_path: false
    environment:
      POSTHORN_API_KEY: ${POSTHORN_API_KEY:?Generate a client key in .env before starting}
      POSTHORN_ADMIN_TOKEN: ${POSTHORN_ADMIN_TOKEN:-}
      POSTHORN_FROM: ${POSTHORN_FROM:?Set a sender address in .env}
      POSTHORN_TO: ${POSTHORN_TO:?Set a default recipient in .env}
      POSTHORN_DRY_RUN: ${POSTHORN_DRY_RUN:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set a provider token or the demo value in .env}
    healthcheck:
      test: ["CMD", "/usr/local/bin/posthorn", "probe", "--url", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
